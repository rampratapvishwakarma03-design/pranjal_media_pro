name: pranjal_media_pro
description: "All-in-One Music Distribution, YouTube CMS Management, and OTT Streaming Platform by Pranjal Films Entertainment."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  supabase_flutter: ^2.5.0
  provider: ^6.1.2
  shared_preferences: ^2.2.3
  file_picker: ^8.0.0
  http: ^1.2.0
  url_launcher: ^6.2.5
  audioplayers: ^6.0.0
  video_player: ^2.8.6
  iconsax: ^0.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
